[tools]
"aqua:air-verse/air" = "1.67.4"
"aqua:a-h/templ" = "0.3.1020"
"aqua:pressly/goose" = "3.27.3"
"aqua:tailwindlabs/tailwindcss" = "3.4.17"
golangci-lint = "2.13.2"
sqlc = "1.31.1"

[env]
TEMPL_DEV_MODE = "true"
GOOSE_MIGRATION_DIR = "migrate/migrations"
RUN_MIGRATIONS = 1
SERVER_PORT = 8001

[tasks.compile]
depends = ["sql", "templ", "tailwind"]
sources = ["**/*.go"]
outputs = ["bin/budgeting"]
env.CGO_ENABLED = 0
env.GOOS = "linux"
env.GOARCH = "arm64"
run = "go build -tags production -trimpath -ldflags='-s -w' -o bin/budgeting ./cmd/app"

[tasks.deb]
depends = ["compile"]
run = """
#!/usr/bin/env bash
set -euo pipefail

VERSION="${1:-0.1.0}"
PACKAGE="budgeting_${VERSION}_arm64"
OUTPUT="$(mktemp -d)"
trap 'rm -rf "$OUTPUT"' EXIT

docker buildx build \
  --file packaging/Dockerfile \
  --build-arg VERSION="$VERSION" \
  --output "type=local,dest=$OUTPUT" \
  .
mv "$OUTPUT/$PACKAGE.deb" "bin/$PACKAGE.deb"
"""

[tasks.sql]
sources = ["migrate/migrations/*.sql"]
run = "sqlc generate"

[tasks.templ]
sources = ["components/**/*.templ"]
run = "templ generate"

[tasks.tailwind]
sources = ["assets/main.css"]
run = "tailwindcss -i ./assets/main.css -o ./assets/dist/tailwind.css --minify"

[tasks.db]
run = "docker compose up -d --wait db"

[tasks.db-down]
run = "docker compose stop db"

[tasks.server]
env.DATABASE_URL = "postgresql://{{env.DB_USER}}:{{env.DB_PASSWORD}}@{{env.DB_HOST}}:{{env.DB_PORT}}/{{env.DB_NAME}}"
env.APP_PORT = "{{env.SERVER_PORT}}"
run = "air -c .air-server.toml"

[tasks.proxy]
run = "templ generate --watch --proxy=\"http://localhost:${SERVER_PORT}\" --proxyport=\"${APP_PORT}\" --open-browser=false"

[tasks.tailwind-watch]
run = "air -c .air-tailwind.toml"

[tasks.sqlc-watch]
run = "air -c .air-sqlc.toml"

[tasks.dev]
depends = ["db"]
run = [
  { tasks = ["server", "proxy", "tailwind-watch", "sqlc-watch"] },
]

[tasks.migrate]
run = "go run ./cmd/migrate up"

[tasks.migrate-create]
usage = '''
arg "<name>" help="The name of the migration to create"
'''
run = "goose create ${usage_name?} sql"

[tasks.migrate-rollback]
run = "go run ./cmd/migrate down"

[tasks.lint]
run = "golangci-lint run"
