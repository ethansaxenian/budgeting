[tools]
"aqua:air-verse/air" = "latest"
"aqua:a-h/templ" = "latest"
"aqua:pressly/goose" = "latest"
"aqua:tailwindlabs/tailwindcss" = "3.4.17"
golangci-lint = "latest"
sqlc = "latest"

[env]
_.file = ".env"
DB_USER = { default = "postgres" }
DB_PASSWORD = { default = "postgres" }
DB_HOST = { default = "localhost" }
DB_PORT = { default = 5432 }
DB_NAME = { default = "budgeting" }
DATABASE_URL = "postgresql://{{env.DB_USER}}:{{env.DB_PASSWORD}}@{{env.DB_HOST}}:{{env.DB_PORT}}/{{env.DB_NAME}}"
GOOSE_MIGRATION_DIR = "migrate/migrations"
RUN_MIGRATIONS = 1

[tasks.compile]
depends = ["sql", "templ", "tailwind"]
sources = ["**/*.go"]
outputs = ["bin/budgeting"]
env.CGO_ENABLED = 0
env.GOOS = "linux"
env.GOARCH = "arm64"
run = "go build -tags production -trimpath -ldflags='-s -w' -o bin/budgeting ./cmd/app"

[tasks.deb]
depends = ["compile"]
run = """
#!/usr/bin/env bash
set -euo pipefail

VERSION="${1:-0.1.0}"
PACKAGE="budgeting_${VERSION}_arm64"
OUTPUT="$(mktemp -d)"
trap 'rm -rf "$OUTPUT"' EXIT

docker buildx build \
  --file packaging/Dockerfile \
  --build-arg VERSION="$VERSION" \
  --output "type=local,dest=$OUTPUT" \
  .
mv "$OUTPUT/$PACKAGE.deb" "bin/$PACKAGE.deb"
"""

[tasks.sql]
sources = ["migrate/migrations/*.sql"]
run = "sqlc generate"

[tasks.templ]
sources = ["components/**/*.templ"]
run = "templ generate"

[tasks.tailwind]
sources = ["assets/main.css"]
run = "tailwindcss -i ./assets/main.css -o ./assets/dist/tailwind.css --minify"

[tasks.db]
run = "docker compose up -d --wait db"

[tasks.db-down]
run = "docker compose stop db"

[tasks.server]
run = "air -c .air-server.toml"

[tasks.proxy]
run = "templ generate --watch --proxy=\"http://localhost:${APP_PORT}\" --open-browser=false --proxybind=localhost"

[tasks.tailwind-watch]
run = "air -c .air-tailwind.toml"

[tasks.sqlc-watch]
run = "air -c .air-sqlc.toml"

[tasks.dev]
depends = ["db"]
run = "mise run server ::: proxy ::: tailwind-watch ::: sqlc-watch"

[tasks.migrate]
run = "go run ./cmd/migrate up"

[tasks.migrate-create]
usage = '''
arg "<name>" help="The name of the migration to create"
'''
run = "goose create {usage_name?} sql"

[tasks.migrate-rollback]
run = "go run ./cmd/migrate down"

[tasks.lint]
run = "golangci-lint run"
