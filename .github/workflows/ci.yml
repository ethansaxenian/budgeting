name: Checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Mise
        uses: jdx/mise-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check formatting
        run: |
          test -z "$(gofmt -s -l .)"
          templ fmt -fail .

      - name: Check generated code
        run: sqlc diff .

      - name: Lint
        run: mise run lint

      - name: Build Debian package
        run: mise run build

